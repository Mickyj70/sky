name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Go ${{ matrix.go }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test with race detection
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/sky ./cmd/sky
      - name: Smoke check
        run: ./bin/sky --help

  release-validation:
    name: M1 release validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Validate clean source and schema-1 recovery
        run: python3 scripts/validate_release.py --report "$RUNNER_TEMP/release-validation.json"
      - name: Preserve validation evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-validation
          path: ${{ runner.temp }}/release-validation.json
          if-no-files-found: error
          retention-days: 30
