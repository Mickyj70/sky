name: CI

on:
  push:
    branches: [main]
    tags: [v1.0.0-rc.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Go ${{ matrix.go }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test with race detection
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/sky ./cmd/sky
      - name: Smoke check
        run: ./bin/sky --help

  release-validation:
    name: M1 and M2 release validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Validate clean source, watchlists and history recovery
        run: python3 scripts/validate_release.py --history-baseline-ref v0.5.0-rc.1 --report "$RUNNER_TEMP/release-validation.json"
      - name: Preserve validation evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-validation
          path: ${{ runner.temp }}/release-validation.json
          if-no-files-found: error
          retention-days: 30

  native-smoke:
    name: Native smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            binary: sky
          - platform: darwin-arm64
            runner: macos-15
            binary: sky
          - platform: windows-amd64
            runner: windows-latest
            binary: sky.exe
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify native target
        shell: bash
        run: test "$(go env GOOS)-$(go env GOARCH)" = "${{ matrix.platform }}"
      - name: Test native behavior with offline fixtures
        run: go test ./...
      - name: Build native binary without CGO
        run: go build -o bin/${{ matrix.binary }} ./cmd/sky
      - name: Package and smoke-test the extracted binary
        run: python scripts/package_platform.py bin/${{ matrix.binary }} packages
      - name: Upload verified archive and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sky-package-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0-rc.1'
    needs: [checks, release-validation, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: sky-package-*
          path: release-assets
      - name: Verify release archives
        run: python3 scripts/verify_release_assets.py release-assets "$(git rev-parse HEAD)" "$GITHUB_REF_NAME"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/sky-package-*/*.zip release-assets/sky-package-*/*.zip.sha256 \
            --verify-tag --prerelease --latest=false --title "Sky $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
